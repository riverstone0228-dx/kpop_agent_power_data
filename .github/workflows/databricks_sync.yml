name: Databricks Sync Only

# 日次収集を回さず、Databricks の Git folder を main に Pull するだけ。
# bronze load Job は API から起動できないため、Pull 後に Databricks UI で「Run now」する
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check Databricks secrets
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_REPO_PATH: ${{ secrets.DATABRICKS_REPO_PATH }}
        run: |
          if [ -z "${DATABRICKS_HOST}" ] || [ -z "${DATABRICKS_TOKEN}" ] || [ -z "${DATABRICKS_REPO_PATH}" ]; then
            echo "Databricks secrets incomplete"
            exit 1
          fi
          echo "Databricks secrets present"

      - name: Pull Databricks Git folder
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_REPO_PATH: ${{ secrets.DATABRICKS_REPO_PATH }}
        run: python scripts/databricks_pull_repo.py
