name: Databricks Sync Only

# 日次収集を回さず、Git folder Pull → bronze load Job だけ再実行する
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Databricks secrets
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
          DATABRICKS_REPO_PATH: ${{ secrets.DATABRICKS_REPO_PATH }}
        run: |
          if [ -z "${DATABRICKS_HOST}" ] || [ -z "${DATABRICKS_TOKEN}" ] || [ -z "${DATABRICKS_JOB_ID}" ] || [ -z "${DATABRICKS_REPO_PATH}" ]; then
            echo "Databricks secrets incomplete"
            exit 1
          fi
          echo "Databricks secrets present"

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Pull Databricks Git folder
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_REPO_PATH: ${{ secrets.DATABRICKS_REPO_PATH }}
        run: python scripts/databricks_pull_repo.py

      - name: Trigger Databricks bronze load job
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
        run: |
          set -euo pipefail
          RUN_NOW_RESP=$(databricks jobs run-now "${DATABRICKS_JOB_ID}" --output json)
          echo "${RUN_NOW_RESP}"
          RUN_ID=$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["run_id"])' <<< "${RUN_NOW_RESP}")
          echo "Triggered Databricks run_id=${RUN_ID}"
          databricks jobs get-run "${RUN_ID}" --output json
