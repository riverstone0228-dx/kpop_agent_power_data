name: Token Expiry Reminder

on:
  schedule:
    # 毎週月曜 00:00 UTC（JST 月曜 09:00）
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "期限に関係なく今すぐ Slack 通知する"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Slack token reminder
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DATABRICKS_TOKEN_EXPIRES_ON: ${{ vars.DATABRICKS_TOKEN_EXPIRES_ON }}
          TOKEN_WARN_DAYS: "14"
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/notify_slack.py --token-reminder --force
          else
            python scripts/notify_slack.py --token-reminder
          fi
