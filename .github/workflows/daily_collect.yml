name: Daily K-pop Data Collection

on:
  schedule:
    # JST 6:00 = UTC 21:00 (前日)
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily collection
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/run_daily.py

      - name: Commit and push data
        run: |
          set -e
          git config user.name "riverstone-bot"
          git config user.email "riverstone0228@gmail.com"
          git add data/raw/ data/youtube_videos/ data/apple_charts/ data/line_charts/ data/spaceshower_charts/ data/other_agency_top15/ data/song_rankings/ data/stock_prices/ docs/
          git add scripts/artist_external_ids.csv scripts/track_external_ids.csv scripts/artist_external_candidates.csv scripts/track_master.csv scripts/artist_master.csv scripts/other_agency_master.csv scripts/agency_logos.csv || true
          if git diff --quiet --cached; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily data collection $(date -u +%Y-%m-%d)"
          fi
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

      # secrets は if: で直接参照できないため、先に有無を判定する
      - name: Check Databricks secrets
        id: databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
          DATABRICKS_REPO_PATH: ${{ secrets.DATABRICKS_REPO_PATH }}
        run: |
          if [ -n "${DATABRICKS_HOST}" ] && [ -n "${DATABRICKS_TOKEN}" ] && [ -n "${DATABRICKS_JOB_ID}" ] && [ -n "${DATABRICKS_REPO_PATH}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Databricks secrets incomplete; skip sync"
          fi

      - name: Setup Databricks CLI
        if: steps.databricks.outputs.enabled == 'true'
        uses: databricks/setup-cli@main

      # Workspace Git folder は自動更新されないため、Job実行前に Pull する
      # Free Edition / 大きい repo では 60s タイムアウトしがちなので長め + リトライ
      - name: Pull Databricks Git folder
        if: steps.databricks.outputs.enabled == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_REPO_PATH: ${{ secrets.DATABRICKS_REPO_PATH }}
        run: |
          set -euo pipefail
          # GitHub 反映待ち（Actions push 直後の pull ずれ対策）
          sleep 15
          python scripts/databricks_pull_repo.py

      - name: Trigger Databricks bronze load job
        if: steps.databricks.outputs.enabled == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
        run: |
          set -euo pipefail
          databricks -v
          python - <<'PY'
          import os, sys
          job_id = os.environ.get("DATABRICKS_JOB_ID", "").strip()
          if not job_id:
              print("DATABRICKS_JOB_ID is empty", file=sys.stderr)
              raise SystemExit(2)
          if not job_id.isdigit():
              print(f"DATABRICKS_JOB_ID is not numeric: {job_id!r}", file=sys.stderr)
              raise SystemExit(2)
          print(f"Validated DATABRICKS_JOB_ID={job_id}")
          PY
          RUN_NOW_RESP=""
          for i in 1 2 3 4; do
            set +e
            RUN_NOW_RESP=$(databricks jobs run-now --json "{\"job_id\": ${DATABRICKS_JOB_ID}}" --output json 2>&1)
            rc=$?
            set -e
            if [ $rc -eq 0 ]; then
              break
            fi
            echo "${RUN_NOW_RESP}" >&2
            if echo "${RUN_NOW_RESP}" | grep -q "Triggering new runs for organization .* is currently disabled temporarily"; then
              wait_s=$((i * 60))
              echo "Databricks temporarily disabled new runs. retry ${i}/4 in ${wait_s}s..."
              sleep "${wait_s}"
              continue
            fi
            exit $rc
          done
          if [ -z "${RUN_NOW_RESP}" ]; then
            echo "Databricks run-now produced empty response" >&2
            exit 1
          fi
          echo "${RUN_NOW_RESP}"
          RUN_ID=$(python -c 'import json,sys; data=json.loads(sys.stdin.read()); rid=data.get("run_id"); assert rid is not None, data; print(rid)' <<< "${RUN_NOW_RESP}")
          echo "Triggered Databricks run_id=${RUN_ID}"
          for i in 1 2 3; do
            if databricks jobs get-run "${RUN_ID}" --output json; then
              exit 0
            fi
            echo "get-run retry ${i}/3 after short wait..."
            sleep 5
          done
          echo "Failed to fetch Databricks run status for run_id=${RUN_ID}" >&2
          exit 1

      - name: Slack notify on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/notify_slack.py --failure "GitHub Actions job failed before/during collection"
