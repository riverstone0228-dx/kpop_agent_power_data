name: Daily K-pop Data Collection

on:
  schedule:
    # JST 6:00 = UTC 21:00 (前日)
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily collection
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/run_daily.py

      - name: Commit and push data
        run: |
          set -e
          git config user.name "riverstone-bot"
          git config user.email "riverstone0228@gmail.com"
          git add data/raw/ data/youtube_videos/ data/apple_charts/ data/line_charts/ data/spaceshower_charts/ data/other_agency_top15/ data/song_rankings/ data/stock_prices/ docs/
          git add scripts/artist_external_ids.csv scripts/track_external_ids.csv scripts/artist_external_candidates.csv scripts/track_master.csv scripts/artist_master.csv scripts/other_agency_master.csv scripts/agency_logos.csv || true
          if git diff --quiet --cached; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily data collection $(date -u +%Y-%m-%d)"
          fi
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

      # secrets は if: で直接参照できないため、先に有無を判定する
      - name: Check Databricks secrets
        id: databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
          DATABRICKS_REPO_PATH: ${{ secrets.DATABRICKS_REPO_PATH }}
        run: |
          if [ -n "${DATABRICKS_HOST}" ] && [ -n "${DATABRICKS_TOKEN}" ] && [ -n "${DATABRICKS_JOB_ID}" ] && [ -n "${DATABRICKS_REPO_PATH}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Databricks secrets incomplete; skip sync"
          fi

      - name: Setup Databricks CLI
        if: steps.databricks.outputs.enabled == 'true'
        uses: databricks/setup-cli@main

      # Workspace Git folder は自動更新されないため、Job実行前に Pull する
      # Free Edition / 大きい repo では 60s タイムアウトしがちなので長め + リトライ
      - name: Pull Databricks Git folder
        if: steps.databricks.outputs.enabled == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_REPO_PATH: ${{ secrets.DATABRICKS_REPO_PATH }}
          # Go SDK / CLI 用（サポートされていれば効く）
          DATABRICKS_HTTP_TIMEOUT_SECONDS: "300"
        run: |
          set -euo pipefail
          echo "Pulling Git folder: ${DATABRICKS_REPO_PATH}"
          # GitHub 反映待ち（Actions push 直後の pull ずれ対策）
          sleep 15

          attempt=1
          max=4
          while [ "${attempt}" -le "${max}" ]; do
            echo "=== Git folder pull attempt ${attempt}/${max} ==="
            set +e
            out=$(databricks repos update "${DATABRICKS_REPO_PATH}" --branch main --output json 2>&1)
            rc=$?
            set -e
            echo "${out}"
            if [ "${rc}" -eq 0 ]; then
              echo "Git folder pull succeeded"
              exit 0
            fi
            # REST API フォールバック（CLI の 60s inactivity timeout を避ける）
            echo "CLI failed (rc=${rc}); trying REST API with 5m timeout..."
            set +e
            rest_out=$(python - <<'PY'
import json, os, sys, urllib.error, urllib.request

host = os.environ["DATABRICKS_HOST"].rstrip("/")
token = os.environ["DATABRICKS_TOKEN"]
path = os.environ["DATABRICKS_REPO_PATH"].rstrip("/")

def req(method, url, body=None, timeout=300):
    data = None if body is None else json.dumps(body).encode("utf-8")
    r = urllib.request.Request(
        url,
        data=data,
        method=method,
        headers={
            "Authorization": f"Bearer {token}",
            "Content-Type": "application/json",
        },
    )
    with urllib.request.urlopen(r, timeout=timeout) as resp:
        return json.loads(resp.read().decode("utf-8"))

# path から repo id を解決
repos = req("GET", f"{host}/api/2.0/repos?path_prefix={path}", timeout=60)
repo_id = None
for r in repos.get("repos") or []:
    if (r.get("path") or "").rstrip("/") == path:
        repo_id = r.get("id")
        break
if repo_id is None and repos.get("repos"):
    # 前方一致しか取れない環境向け: path を含む最初の候補
    for r in repos.get("repos") or []:
        if path in (r.get("path") or ""):
            repo_id = r.get("id")
            break
if repo_id is None:
    print("ERROR: repo not found for path", path, file=sys.stderr)
    print(json.dumps(repos, ensure_ascii=False)[:2000], file=sys.stderr)
    sys.exit(2)

print(f"Resolved repo_id={repo_id}")
try:
    updated = req(
        "PATCH",
        f"{host}/api/2.0/repos/{repo_id}",
        body={"branch": "main"},
        timeout=300,
    )
except urllib.error.HTTPError as e:
    body = e.read().decode("utf-8", errors="replace")
    print(f"HTTP {e.code}: {body}", file=sys.stderr)
    sys.exit(1)
except Exception as e:
    print(f"REST pull failed: {e}", file=sys.stderr)
    sys.exit(1)

print(json.dumps(updated, ensure_ascii=False))
print("REST Git folder pull succeeded")
PY
)
            rest_rc=$?
            set -e
            echo "${rest_out}"
            if [ "${rest_rc}" -eq 0 ]; then
              exit 0
            fi

            if [ "${attempt}" -eq "${max}" ]; then
              echo "Git folder pull failed after ${max} attempts"
              exit 1
            fi
            sleep_s=$((attempt * 45))
            echo "Retrying in ${sleep_s}s..."
            sleep "${sleep_s}"
            attempt=$((attempt + 1))
          done

      - name: Trigger Databricks bronze load job
        if: steps.databricks.outputs.enabled == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
        run: |
          set -euo pipefail
          RUN_NOW_RESP=$(databricks jobs run-now "${DATABRICKS_JOB_ID}" --output json)
          echo "${RUN_NOW_RESP}"
          RUN_ID=$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["run_id"])' <<< "${RUN_NOW_RESP}")
          echo "Triggered Databricks run_id=${RUN_ID}"
          databricks jobs get-run "${RUN_ID}" --output json

      - name: Slack notify on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/notify_slack.py --failure "GitHub Actions job failed before/during collection"
