name: Daily K-pop Data Collection

on:
  schedule:
    # JST 6:00 = UTC 21:00 (前日)
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily collection
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/run_daily.py

      - name: Commit and push data
        run: |
          set -e
          git config user.name "riverstone-bot"
          git config user.email "riverstone0228@gmail.com"
          git add data/raw/ data/youtube_videos/ data/apple_charts/ data/line_charts/ data/spaceshower_charts/ data/other_agency_top15/ data/song_rankings/ data/stock_prices/ docs/
          git add scripts/artist_external_ids.csv scripts/track_external_ids.csv scripts/artist_external_candidates.csv scripts/track_master.csv scripts/artist_master.csv scripts/other_agency_master.csv scripts/agency_logos.csv || true
          if git diff --quiet --cached; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily data collection $(date -u +%Y-%m-%d)"
          fi
          git fetch origin main
          if ! git pull --rebase origin main; then
            echo "Rebase conflict detected. Prefer freshly generated files for known outputs."
            for f in \
              data/raw/$(date -u +%Y-%m-%d).csv \
              data/youtube_videos/$(date -u +%Y-%m-%d).csv \
              data/apple_charts/$(date -u +%Y-%m-%d).csv \
              data/apple_charts/summary_$(date -u +%Y-%m-%d).csv \
              data/line_charts/$(date -u +%Y-%m-%d).csv \
              data/line_charts/summary_$(date -u +%Y-%m-%d).csv \
              data/other_agency_top15/$(date -u +%Y-%m-%d).csv \
              data/other_agency_top15/changelog_$(date -u +%Y-%m-%d).txt \
              data/song_rankings/top_$(date -u +%Y-%m-%d).csv \
              data/song_rankings/hot_$(date -u +%Y-%m-%d).csv \
              data/stock_prices/$(date -u +%Y-%m-%d).csv \
              docs/data/report.json \
              scripts/artist_external_candidates.csv \
              scripts/artist_external_ids.csv \
              scripts/track_external_ids.csv \
              scripts/track_master.csv
            do
              if git diff --name-only --diff-filter=U | grep -qx "$f"; then
                # rebase中の "theirs" は今まさに積み直しているローカル収集コミット
                git checkout --theirs -- "$f"
                git add "$f"
              fi
            done
            GIT_EDITOR=true git rebase --continue
          fi
          git push origin HEAD:main

      # secrets は if: で直接参照できないため、先に有無を判定する
      - name: Check Databricks secrets
        id: databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_REPO_PATH: ${{ secrets.DATABRICKS_REPO_PATH }}
        run: |
          if [ -n "${DATABRICKS_HOST}" ] && [ -n "${DATABRICKS_TOKEN}" ] && [ -n "${DATABRICKS_REPO_PATH}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Databricks secrets incomplete; skip sync"
          fi

      # Workspace Git folder は自動更新されないため Pull だけ行う。
      # Job 本体は Databricks 側のスケジュールで実行する（API からの run-now は組織単位で拒否されるため）
      # Free Edition / 大きい repo では 60s タイムアウトしがちなので長め + リトライ
      - name: Pull Databricks Git folder
        if: steps.databricks.outputs.enabled == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_REPO_PATH: ${{ secrets.DATABRICKS_REPO_PATH }}
        run: |
          set -euo pipefail
          # GitHub 反映待ち（Actions push 直後の pull ずれ対策）
          sleep 15
          python scripts/databricks_pull_repo.py

      - name: Slack notify on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/notify_slack.py --failure "GitHub Actions job failed before/during collection"
