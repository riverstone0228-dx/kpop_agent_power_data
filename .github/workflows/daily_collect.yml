name: Daily K-pop Data Collection

on:
  schedule:
    # JST 6:00 = UTC 21:00 (前日)
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily collection
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/run_daily.py

      - name: Commit and push data
        run: |
          set -e
          git config user.name "riverstone-bot"
          git config user.email "riverstone0228@gmail.com"
          git add data/raw/ data/youtube_videos/ data/apple_charts/ data/line_charts/ data/spaceshower_charts/ data/other_agency_top15/ data/song_rankings/ docs/
          git add scripts/artist_external_ids.csv scripts/track_external_ids.csv scripts/artist_external_candidates.csv scripts/track_master.csv scripts/artist_master.csv scripts/other_agency_master.csv scripts/agency_logos.csv || true
          if git diff --quiet --cached; then
            echo "No data changes to commit."
          else
            git commit -m "chore: daily data collection $(date -u +%Y-%m-%d)"
          fi
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Setup Databricks CLI
        if: ${{ success() && secrets.DATABRICKS_HOST != '' && secrets.DATABRICKS_TOKEN != '' && secrets.DATABRICKS_JOB_ID != '' }}
        uses: databricks/setup-cli@main

      - name: Trigger Databricks bronze load job
        if: ${{ success() && secrets.DATABRICKS_HOST != '' && secrets.DATABRICKS_TOKEN != '' && secrets.DATABRICKS_JOB_ID != '' }}
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_JOB_ID: ${{ secrets.DATABRICKS_JOB_ID }}
        run: |
          set -euo pipefail
          RUN_NOW_RESP=$(databricks jobs run-now "${DATABRICKS_JOB_ID}" --output json)
          echo "${RUN_NOW_RESP}"
          RUN_ID=$(python -c 'import json,sys; print(json.loads(sys.stdin.read())["run_id"])' <<< "${RUN_NOW_RESP}")
          echo "Triggered Databricks run_id=${RUN_ID}"
          databricks jobs get-run "${RUN_ID}" --output json

      - name: Slack notify on job failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/notify_slack.py --failure "GitHub Actions job failed before/during collection"
